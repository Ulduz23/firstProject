server:
  port: 8081
  servlet:
    context-path: /api/market-place

spring:
  application:
    name: Market Place
  datasource:
    url: jdbc:postgresql://localhost:5432/market_place?currentSchema=public
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-main.yaml
    default-schema: public

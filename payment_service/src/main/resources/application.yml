server:
  port: 8084
  servlet:
    context-path: /api/payment

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_service?currentSchema=public
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-main.yaml
    default-schema: public

clients:
  notification:
    base-url: http://localhost:8083/api/notification/notifications
